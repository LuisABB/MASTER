---
# ============================================================
# Job — Paso 3: Loader S3 Parquet → MongoDB analytics_db
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: job-parquet-loader
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: loader
          image: mongo-loader:latest
          imagePullPolicy: Never
          env:
            - name: S3_ENDPOINT
              value: "http://localstack:4566"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
