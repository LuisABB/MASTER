---
# ============================================================
# LocalStack — Simula AWS S3 localmente dentro de Minikube
# Endpoints disponibles en: http://localstack:4566
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: default
  labels:
    app: localstack
    step: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.4
          ports:
            - containerPort: 4566
              name: gateway
          env:
            - name: SERVICES
              value: "s3"
            - name: DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: DEBUG
              value: "0"
            - name: PERSISTENCE
              value: "0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 20
            periodSeconds: 10
---
# ============================================================
# Service — expone LocalStack dentro del cluster
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: default
  labels:
    app: localstack
spec:
  selector:
    app: localstack
  ports:
    - name: gateway
      port: 4566
      targetPort: 4566
      protocol: TCP
  type: ClusterIP
